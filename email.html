<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Email</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f3ef; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #17171c; }
  iframe { border: 0; width: 100%; height: 100vh; display: block; }
  .msg { display: grid; place-items: center; height: 100vh; text-align: center; padding: 20px; box-sizing: border-box; }
</style>
</head>
<body>
<div class="msg" id="msg">Loading…</div>
<script>
(function () {
  var t = new URLSearchParams(location.search).get('t') || '';
  fetch('https://otljdgrjrikuejmlwnpv.supabase.co/functions/v1/bk-mail', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'view', token: t }) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Not found'); return j; }); })
    .then(function (j) {
      document.title = j.subject || 'Email';
      var f = document.createElement('iframe');
      f.title = 'Email'; f.setAttribute('sandbox', 'allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation');
      f.srcdoc = j.html.replace('<head>', '<head><base target="_blank">');
      document.getElementById('msg').replaceWith(f);
    })
    .catch(function (e) { document.getElementById('msg').textContent = e.message; });
})();
</script>
</body>
</html>
