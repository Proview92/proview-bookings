.wordmark{letter-spacing:.04em;font-size:15px;white-space:nowrap;font-weight:500;color:#fff}
.wordmark span{background:var(--grad-light);-webkit-background-clip:text;background-clip:text;color:transparent}
.collapse-btn{margin-left:auto;background:none;border:0;color:#8b8b95;cursor:pointer;padding:4px;border-radius:6px}
.collapse-btn:hover{background:rgba(255,255,255,.08)}
.nav{flex:1;overflow:auto;padding:6px 10px}
.nav-sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6e6e78;padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#c9c9d1;padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left;font-weight:500;position:relative}
.nav button:hover{background:#1f1f25;color:#fff}
.nav button.on{background:#26262e;color:#fff}
.nav button.on svg{color:var(--pri)}
.nav .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:10px}
.venue{margin:10px;padding:12px;border-radius:12px;background:#1f1f25;border:1px solid #26262e;font-size:12px}
.venue b{color:#fff;display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.side-foot{display:flex;gap:6px;padding:0 10px 14px}
.side-foot button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#23232a;border:1px solid #33333c;color:#ddd;border-radius:9px;padding:8px;cursor:pointer;font-size:12.5px}
.side-foot button:hover{background:#2c2c34}
.app.collapsed .lbl,.app.collapsed .brand .wordmark,.app.collapsed .nav-sec,.app.collapsed .venue,.app.collapsed .cnt{display:none}
.app.collapsed .nav button{justify-content:center}
.app.collapsed .side-foot{flex-direction:column}
.app.collapsed .brand{flex-direction:column}
.app.collapsed .collapse-btn{margin:0;transform:rotate(180deg)}
.slbl{display:none}
.app.collapsed .nav button{flex-direction:column;gap:4px;padding:8px 2px 7px}
.app.collapsed .slbl{display:block;font-size:10.5px;line-height:1.15;font-weight:500;text-align:center;white-space:nowrap;letter-spacing:-.1px}
.app.collapsed .side-foot button{flex-direction:column;gap:3px;padding:7px 2px}
.app.collapsed .side-foot .slbl{font-size:10px}
@media (min-width:701px) and (max-width:900px){.app .nav button{flex-direction:column;gap:4px;padding:8px 2px 7px;justify-content:center}.app .slbl{display:block;font-size:10.5px;line-height:1.15;font-weight:500;text-align:center;white-space:nowrap;letter-spacing:-.1px}.app .side-foot button{flex-direction:column;gap:3px;padding:7px 2px}.app .side-foot .slbl{font-size:10px}}
@media (max-width:700px){.slbl,.app.collapsed .slbl{display:none!important}}

/* sign-in page (same design as Proview Signage) */
body.gate #app{display:none}
.auth{position:fixed;inset:0;z-index:55;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg);overflow:auto}
.auth[hidden]{display:none}
.auth-art{background:#141418;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-height:100vh;box-sizing:border-box}
.auth-art .brand{display:flex;align-items:center;gap:10px;padding:0}
.auth-art .brand .logo{width:36px;height:26px}
.auth-art h2{font-size:clamp(30px,3.2vw,40px);line-height:1.05;max-width:400px;letter-spacing:-.03em;margin:0;font-weight:700;position:relative;z-index:1}
.auth-art .sub{color:#9a9aa4;max-width:300px;font-size:15px;line-height:1.45;position:relative;z-index:1}
.auth-art .tv{position:absolute;right:-60px;bottom:70px;width:min(420px,48vw);aspect-ratio:16/10;border-radius:18px;background:linear-gradient(135deg,#62b0ec,#6d6fb2 55%,#3f86d6);box-shadow:0 0 0 10px #26262e,0 40px 80px rgba(0,0,0,.4);transform:rotate(-6deg);overflow:hidden}
.auth-art .tv i{position:absolute;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.55);border-radius:10px}
.auth-art .tv i.r{border-radius:50%}
.auth-art .tv i.b{background:rgba(255,255,255,.85);border-color:#fff}
.auth-form{display:grid;place-items:center;padding:32px 20px}
.auth-form form{background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 32px;width:min(440px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(20,20,30,.04),0 18px 50px -18px rgba(20,20,30,.18)}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.auth-brand .logo{width:94px;height:64px;background-size:contain;background-repeat:no-repeat;background-position:center}
.auth-brand .wordmark{font-size:20px;letter-spacing:.14em;color:var(--ink)}
.auth h1{font-size:26px;margin:0;letter-spacing:-.02em;font-weight:700}
.auth .muted{color:var(--mut,#6b6b76);margin:0;font-size:15px;line-height:1.45}
.auth label.af{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#3d3d46}
.auth label.af input{height:44px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink);width:100%}
.auth label.af input:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
.auth .pw-wrap{position:relative}.auth .pw-wrap input{padding-right:44px}
.auth .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;color:#8a8a94;cursor:pointer;display:grid;place-items:center;border-radius:8px}
.auth .pw-eye:hover{color:var(--ink);background:var(--bg)}
.auth .pw-eye.on{color:var(--pri)}
.auth .pw-match{font-size:12.5px;margin-top:4px;font-weight:500}.auth .pw-match.ok{color:#12a150}.auth .pw-match.bad{color:#d92d20}
.auth .go{height:44px;border:0;border-radius:10px;background:linear-gradient(135deg,#2f84d4 0%,#5a5fbb 100%);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.auth .go:disabled{opacity:.6;cursor:default}
.auth .alinks{display:flex;justify-content:space-between;gap:8px}

AFTER.planner=()=>{

 const hh=hoursFor(U.date),nmn=nowMin();if(!U.keepScroll){const target=U.date===today()&&nmn>=toMin(hh.open)&&nmn<=closeM(hh)?nmn-45:toMin(hh.open)-15;wrap.scrollLeft=Math.max(0,(target-o)*ppm)}else if(U.keepScroll){wrap.scrollLeft=U.keepScroll;U.keepScroll=0}
 wrap.querySelectorAll('.g-bar[data-pid]').forEach(b=>{
  b.onpointerdown=e=>{e.stopPropagation();const sx=e.clientX,sy=e.clientY,l0=parseFloat(b.style.left);let moved=false;b.setPointerCapture(e.pointerId);
   b.onpointermove=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;if(moved){b.classList.add('drag');b.style.left=(l0+dx)+'px';b.style.transform=`translateY(${dy}px)`}};
   b.onpointerup=ev=>{b.onpointermove=null;b.onpointerup=null;const p=S.parties.find(x=>x.id===b.dataset.pid);
    if(!moved){editParty(p.id);return}
    const dm=Math.round((ev.clientX-sx)/ppm/15)*15;b.style.visibility='hidden';const el=document.elementFromPoint(ev.clientX,ev.clientY);b.style.visibility='';
    const track=el&&el.closest('.g-track[data-tid]');const tid=track?track.dataset.tid:p.tables[0];const nt=fromMin(Math.max(0,Math.min(1425,toMin(p.time)+dm)));
    const newTables=p.tables.length>1&&tid===p.tables[0]?p.tables:[tid];
    U.keepScroll=wrap.scrollLeft;
    if(newTables.every(t=>isFree(t,p.date,nt,p.dur,p.id))){const was=`${p.tables.map(tName).join('+')} ${p.time}`;p.time=nt;p.tables=newTables;logH(p,`Moved from ${was} to ${tName(tid)} ${nt}`);save();toast(`${pName(p)} moved to ${tName(tid)} at ${nt}`)}else toast('That table is already booked at that time');
    render()}}});

AFTER.floor=()=>{
 const cv=$('#canvas');if(!cv)return;
 if(!U.zoomSet){const w=cv.parentElement.clientWidth-12;const z=Math.min(1,Math.max(.4,Math.floor(w/900*20)/20));if(Math.abs(z-U.zoom)>.001){U.zoom=z;render();return}}
 cv.parentElement.style.minHeight=(520*U.zoom+20)+'px';
 const drag=(el,obj,onClick)=>{el.onpointerdown=e=>{e.preventDefault();const sx=e.clientX,sy=e.clientY,x0=obj.x,y0=obj.y;let mv=false;el.setPointerCapture(e.pointerId);
  el.onpointermove=ev=>{const dx=(ev.clientX-sx)/U.zoom,dy=(ev.clientY-sy)/U.zoom;if(Math.abs(dx)+Math.abs(dy)>3)mv=true;obj.x=Math.max(0,Math.min(900-el.offsetWidth,Math.round((x0+dx)/10)*10));obj.y=Math.max(0,Math.min(520-el.offsetHeight,Math.round((y0+dy)/10)*10));el.style.left=obj.x+'px';el.style.top=obj.y+'px'};
  el.onpointerup=()=>{el.onpointermove=null;el.onpointerup=null;save();onClick(mv)}}};
 cv.querySelectorAll('.ftable').forEach(el=>{const t=S.tables.find(x=>x.id===el.dataset.ftid);
  if(U.editFloor)drag(el,t,()=>{U.selTable=t.id;U.selDecor=null;render()});

 cv.querySelectorAll('.decor').forEach(el=>{const d=S.decor.find(x=>x.id===el.dataset.did);if(U.editFloor)drag(el,d,()=>{U.selDecor=d.id;U.selTable=null;render()})});

 <div class="card"><div class="pad row between" style="border-bottom:1px solid var(--line)"><b>${U.revFilter?U.revFilter+'★ reviews':'All reviews'}</b>${U.revFilter?`<button class="btn sm ghost" data-act="set" data-k="revFilter" data-v="0">Clear filter</button>`:`<button class="btn sm ghost" data-act="disableReviews">Turn off reviews</button>`}</div>
  ${rs.map(r=>`<div class="review"><div class="row between"><div class="row"><div class="av">${initials(r.guest)}</div><div><b>${esc(r.guest)}</b><div class="small mut">${fmtDate(r.date,{day:'numeric',month:'short',year:'numeric'})} · ${esc(r.source)}</div></div></div><span class="stars">${'★'.repeat(r.rating)}<span style="color:var(--line)">${'★'.repeat(5-r.rating)}</span></span></div><p style="margin:10px 0 0">${esc(r.text)}</p>

/* --- reports --- */
function reportRange(){const t=today();const d=dow(t);const mon=addDays(t,-((d+6)%7));if(U.rRange==='week')return[mon,addDays(mon,6)];if(U.rRange==='last')return[addDays(mon,-7),addDays(mon,-1)];return[addDays(t,-29),t]}
function bars(data,{h=200,color='var(--pri)'}={}){const max=Math.max(1,...data.map(d=>d.value));return`<div class="bars" style="height:${h}px">${data.map(d=>`<div class="bar-col" title="${esc(d.label)}: ${d.value}"><span class="bar-v">${d.value||''}</span><div class="bar" style="height:${d.value/max*(h-50)}px;background:${d.color||color}"></div><span class="bar-l">${esc(d.label)}</span></div>`).join('')}</div>`}
function lineChart(labels,series,h=220){
 const W=Math.round(Math.max(340,Math.min(640,innerWidth-(innerWidth>900?520:innerWidth>700?160:120)))),PL=34,PR=26,PT=12,PB=28;const n=labels.length;const max=Math.max(1,...series.flatMap(s=>s.vals));const nice=Math.ceil(max/4)*4||4;
 const x=i=>PL+(n<=1?(W-PL-PR)/2:i*(W-PL-PR)/(n-1));const y=v=>PT+(h-PT-PB)*(1-v/nice);
 let g='';for(let k=0;k<=4;k++){const v=nice*k/4;g+=`<line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${PL-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--mut)">${Math.round(v)}</text>`}
 const step=Math.ceil(n/10);labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(l)}</text>`});
 series.forEach(s=>{const pts=s.vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');if(s.fill)g+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="${s.color}" opacity=".12"/>`;g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`+s.vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--card)" stroke="${s.color}" stroke-width="1.8"><title>${esc(labels[i])}: ${v}</title></circle>`).join('')});
 return`<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;display:block">${g}</svg><div class="legend" style="justify-content:center;margin-top:4px">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`}
VIEWS.reports=()=>{
 const [a,b]=reportRange();
 let ps=S.parties.filter(p=>p.date>=a&&p.date<=b&&p.kind!=='queue'&&p.kind!=='enquiry'&&p.status!=='deleted');
 if(U.rDow!=='any')ps=ps.filter(p=>dow(p.date)===+U.rDow);
 if(U.rSeat==='yes')ps=ps.filter(p=>p.status==='finished'||ACTIVE.includes(p.status));if(U.rSeat==='no')ps=ps.filter(p=>DEAD.includes(p.status));
 const ok=U.rSeat==='no'?ps:ps.filter(p=>!DEAD.includes(p.status));const seated=ps.filter(p=>p.status==='finished'||ACTIVE.includes(p.status));
 const cov=ok.reduce((x,p)=>x+p.size,0);const past=ps.filter(p=>p.date<=today());const ns=past.filter(p=>p.status==='noshow').length;
 const days=[];for(let d=a;d<=b;d=addDays(d,1))days.push(d);
 const lab=d=>U.rRange==='30'?fmtDate(d,{day:'numeric',month:'short'}):fmtDate(d,{weekday:'short',day:'numeric'});
 const byDay=days.map(d=>({label:U.rRange==='30'?fmtDate(d,{day:'numeric'}):fmtDate(d,{weekday:'short'}),value:ok.filter(p=>p.date===d).reduce((x,p)=>x+p.size,0),color:d===today()?'#5a5fbb':null}));
 const hrs=[];for(let h=7;h<=23;h++)hrs.push({label:h+':00',value:ok.filter(p=>Math.floor(toMin(p.time)/60)===h).reduce((x,p)=>x+p.size,0)});
 const chan=S.channels.map(c=>({n:c.name,v:ok.filter(p=>p.channel===c.id).length})).sort((x,y)=>y.v-x.v);const cmax=Math.max(1,...chan.map(c=>c.v));
 const sizes=[1,2,3,4,5,6].map(s=>({label:s===6?'6+':String(s),value:ok.filter(p=>s===6?p.size>=6:p.size===s).length}));
 const types=S.types.map(t=>({label:t.name.length>11?t.name.slice(0,10)+'…':t.name,value:ok.filter(p=>p.type===t.id).length,color:t.color}));
 const wd=[1,2,3,4,5,6,0],wdn=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 const hoursUsed=[...new Set(ok.map(p=>Math.floor(toMin(p.time)/60)))].sort((x,y)=>x-y);
 const cell=(list)=>({p:list.length,c:list.reduce((x,p)=>x+p.size,0)});
 let pmax=1;hoursUsed.forEach(h=>wd.forEach(d=>{pmax=Math.max(pmax,cell(ok.filter(p=>dow(p.date)===d&&Math.floor(toMin(p.time)/60)===h)).c)}));
 const pivot=`<div style="overflow:auto"><table class="t pivot"><thead><tr><th>Hour</th>${wdn.map(d=>`<th style="text-align:center">${d}</th>`).join('')}<th style="text-align:center">Total</th></tr></thead><tbody>${hoursUsed.map(h=>{const row=wd.map(d=>cell(ok.filter(p=>dow(p.date)===d&&Math.floor(toMin(p.time)/60)===h)));const tot=cell(ok.filter(p=>Math.floor(toMin(p.time)/60)===h));return`<tr><td><b>${pad(h)}:00</b></td>${row.map(x=>`<td style="text-align:center;background:rgba(74,108,208,${(x.c/pmax*.55).toFixed(2)});${x.c/pmax>.6?'color:#fff':''}">${x.p?`<b>${x.c}</b><div class="small" style="opacity:.75">${x.p} pty</div>`:'<span class="mut">·</span>'}</td>`).join('')}<td style="text-align:center"><b>${tot.c}</b><div class="small mut">${tot.p} pty</div></td></tr>`}).join('')}
  <tr><td><b>Totals</b></td>${wd.map(d=>{const x=cell(ok.filter(p=>dow(p.date)===d));return`<td style="text-align:center"><b>${x.c}</b><div class="small mut">${x.p} pty</div></td>`}).join('')}<td style="text-align:center"><b>${cov}</b><div class="small mut">${ok.length} pty</div></td></tr></tbody></table></div><div class="small mut" style="margin-top:6px">Covers (bold) and parties by arrival hour and day of week.</div>`;
 const sel=(k,opts,lab)=>`<label class="flt"><span>${lab}</span><select class="inp" data-act-change="rf" data-k="${k}">${opts.map(([v,l])=>`<option value="${v}" ${U[k]==v?'selected':''}>${l}</option>`).join('')}</select></label>`;
 return `<div class="row between" style="margin-bottom:14px;align-items:flex-end"><div class="row" style="align-items:flex-end">${sel('rRange',[['week','This week'],['last','Last week'],['30','Last 30 days']],'Party date')}${sel('rDow',[['any','Any day'],...['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>[i,d])],'Day of week')}${sel('rSeat',[['any','Any'],['yes','Yes'],['no','No (cancelled & no-shows)']],'Seated')}</div><span class="mut">${fmtDate(a)} – ${fmtDate(b)}</span></div>
 <div class="grid3" style="grid-template-columns:1fr 220px;margin-bottom:14px"><div class="card pad"><b>All parties</b>${lineChart(days.map(lab),[{name:'Total parties',color:'#4a6cd0',vals:days.map(d=>ok.filter(p=>p.date===d).length),fill:true},{name:'Seated parties',color:'#12a150',vals:days.map(d=>seated.filter(p=>p.date===d).length)}])}</div>
  <div style="display:flex;flex-direction:column;gap:12px"><div class="card stat" style="flex:1"><div class="k">Total parties</div><div class="v">${ok.length}</div><div class="small mut">${cov} total covers</div></div><div class="card stat" style="flex:1"><div class="k">Seated parties</div><div class="v">${seated.length}</div><div class="small mut">${seated.reduce((x,p)=>x+p.size,0)} seated covers</div></div></div></div>
 <div class="stats"><div class="card stat"><div class="k">Avg party size</div><div class="v">${ok.length?(cov/ok.length).toFixed(1):0}</div></div><div class="card stat"><div class="k">Walk-in share</div><div class="v">${ok.length?Math.round(ok.filter(p=>p.kind==='walkin').length/ok.length*100):0}%</div></div><div class="card stat"><div class="k">No-show rate</div><div class="v" style="color:${ns/(past.length||1)>.05?'var(--bad)':'inherit'}">${past.length?(ns/past.length*100).toFixed(1):0}%</div></div><div class="card stat"><div class="k">Cancellations</div><div class="v">${ps.filter(p=>p.status==='cancelled').length}</div></div><div class="card stat"><div class="k">Deposits taken</div><div class="v">${money(ok.reduce((x,p)=>x+(p.deposit||0),0))}</div></div></div>
 <div class="card pad" style="margin-bottom:14px"><b>By time of day</b>${pivot}</div>
 <div class="grid2"><div class="card pad"><b>By day of week</b>${bars(wd.map((d,i)=>({label:wdn[i],value:ok.filter(p=>dow(p.date)===d).reduce((x,p)=>x+p.size,0)})))}</div><div class="card pad"><b>Covers by day</b>${bars(byDay)}</div><div class="card pad"><b>Covers by arrival time</b>${bars(hrs,{color:'#62b0ec'})}</div>
 <div class="card pad"><b>Bookings by channel</b>${chan.map(c=>`<div class="hbar"><span>${esc(c.n)}</span><div class="tr"><div style="width:${c.v/cmax*100}%"></div></div><b style="text-align:right">${c.v}</b></div>`).join('')}</div>
 <div class="card pad"><b>Party sizes</b>${bars(sizes,{h:180,color:'#5a5fbb'})}</div><div class="card pad"><b>Booking types</b>${bars(types,{h:180})}</div></div>`;
};

const SETS=[['account','Account','user','Location details, your details and team access'],['prefs','System preferences','cog','Guest screen theme, seating times and queue defaults'],['hours','Opening hours','hours','Opening times for each day and closed dates'],['floor','Floor plan editor','floor','Lay out areas, tables, connected tables and priorities'],['bookings','Bookings','cal','Schedules, policies, public links and booking rules'],['types','Booking types','layers','Standard bookings and experiences'],['comms','Communications','mail','Guest emails, staff notifications and SMS reminders'],['queue','Queue access','queue','QR code and remote queue access'],['templates','Templates','tag','Quick replies and party tags'],['integrations','Integrations','plug','Connect Google, POS, marketing and more']];

const num=(path,w=90,extra='')=>`<input class="inp" type="number" min="0" style="width:${w}px" data-bind="${path}" value="${getPath(S,path)??''}" ${extra}>`;
const txt=(path,w=260,ph='')=>`<input class="inp" style="width:${w==='100%'?'100%':w+'px'};max-width:100%" data-bind="${path}" value="${esc(getPath(S,path)??'')}" placeholder="${esc(ph)}">`;
const stabs=(list)=>{const cur=U.setTab&&list.some(l=>l[0]===U.setTab)?U.setTab:list[0][0];return[cur,`<div class="seg" style="margin-bottom:16px">${list.map(([k,l])=>`<button class="${cur===k?'on':''}" data-act="set" data-k="setTab" data-v="${k}">${l}</button>`).join('')}</div>`]};
const DAYS3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const sizeChips=(path,maxN)=>{const cur=getPath(S,path)||[];return`<div class="tagpick">${Array.from({length:maxN},(_,i)=>i+1).map(n=>`<button class="${cur.includes(n)?'on':''}" data-act="sizeChip" data-path="${path}" data-n="${n}" style="min-width:38px">${n}</button>`).join('')}</div>`};

  queue:()=>{const Q=S.settings.queue;return`<div class="grid2" style="align-items:start"><div class="card pad"><b>QR code</b>${setRow('Enable access to the queue via QR code','Guests scan the code at the door to join',tog('settings.queue.qr',1))}${Q.qr?`<label class="f">Party sizes that can use the QR code</label>${sizeChips('settings.queue.qrSizes',12)}<button class="btn sm" style="margin-top:12px" data-act="showQR" data-v="${esc(bookLink('queue=1'))}" data-t="Scan to join the queue">${ic('grid',14)} Show QR code</button>`:''}</div>
   <div class="card pad"><b>Remote queue</b>${setRow('Let guests join the queue remotely','From your booking page and the Proview app',tog('settings.queue.online',1))}${Q.online?`<label class="f">Party sizes that can join remotely</label>${sizeChips('settings.queue.remoteSizes',12)}`:''}${setRow('Maximum queue length','Parties',num('settings.queue.maxLen'))}${setRow('Text guests when their table is ready','',tog('settings.queue.smsReady'))}</div>
   <div class="card pad"><b>Mark queue as closed</b>${setRow('Queue closed','Stop new guests joining by QR code or remotely',Q.qr||Q.online?tog('settings.queue.closed',1):'<span class="small mut">Enable QR code or remote queuing to use this</span>')}</div></div>`},
  templates:()=>{const [t,tb]=stabs([['msg','Messages'],['ptags','Party tags']]);
   if(t==='ptags')return tb+`<div class="card pad" style="max-width:820px">${tagGroups('p')}</div>`;
   return tb+`<div class="card pad" style="max-width:760px"><div class="row between"><div><b>Message templates</b><div class="small mut">Reusable texts to send in guest chat — handy for guests in the queue.</div></div><button class="btn sm" data-act="addReply">${ic('plus',14)} Add</button></div>${S.quickReplies.map((q,i)=>`<div class="setrow"><input class="inp" style="max-width:none" value="${esc(q)}" data-qr="${i}"><button class="icon-btn" data-act="delReply" data-i="${i}">${ic('trash',15)}</button></div>`).join('')}</div>`},
  integrations:()=>{const I=S.settings.integrations;const link=bookLink('');const items=[['google','Reserve with Google','Bookings from Google Search & Maps'],['app','Proview app','Listing in the Proview consumer app'],['airship','Airship','Targeted messages, loyalty programmes and personalised offers'],['pos','Point of sale','Sync table status and spend with your POS'],['mailchimp','Mailchimp','Sync opted-in guests to your mailing list'],['instagram','Instagram','"Reserve" button on your profile'],['xero','Xero','Send deposits and no-show fees to accounts'],['widget','Website widget','Embed booking on your own site'],['stripe','Stripe deposits','Take deposits on the public booking page (needs cloud sync + Stripe keys)']];
   return `<div class="cards">${items.map(([k,n,d])=>`<div class="card pad"><div class="row between"><div class="navcard" style="padding:0;cursor:default"><div class="ic">${ic('plug',18)}</div></div><label class="toggle"><input type="checkbox" data-bind="settings.integrations.${k}" ${I[k]?'checked':''}><span></span></label></div><b style="display:block;margin-top:10px">${n}</b><div class="small mut">${d}</div></div>`).join('')}</div>
   ${cloudCard()}<div class="card pad" style="margin-top:16px"><b>Your booking link</b><div class="row" style="margin-top:8px"><div class="code" style="flex:1">${esc(link)}</div><button class="btn sm" data-act="copy" data-v="${esc(link)}">${ic('copy',14)} Copy</button></div><b style="display:block;margin-top:14px">Website embed code</b><div class="row" style="margin-top:8px"><div class="code" style="flex:1">${esc(`<iframe src="${link}?embed=1" width="420" height="640" style="border:0"></iframe>`)}</div><button class="btn sm" data-act="copy" data-v="${esc(`<iframe src="${link}?embed=1" width="420" height="640" style="border:0"></iframe>`)}">${ic('copy',14)} Copy</button></div></div>
   <div class="card pad" style="margin-top:16px"><b>Looking for another integration?</b><div class="small mut">Tell us what you need and we'll look into it.</div><div class="row" style="margin-top:10px"><input class="inp" id="reqInt" placeholder="e.g. OpenTable sync, Square POS" style="flex:1"><button class="btn sm pri" data-act="requestInt">Request an integration</button></div></div>`}

let D=null;
function newParty(kind='booking',pre={}){
 const size=pre.size||2;
 D={id:null,kind,type:'std',size,date:pre.date||U.date||today(),time:pre.time||nextSlot(),dur:durFor(size),tables:pre.tables||[],guest:null,gname:'',gphone:'',gemail:'',notes:'',tags:[],channel:kind==='walkin'?'walkin':'phone',status:kind==='queue'?'waiting':'booked',quote:S.settings.queue.defaultWait,durTouched:false,...pre};
 if(kind!=='booking'){D.date=today();D.time=fromMin(nowMin())}
 renderPD();
}
function editParty(id){const p=S.parties.find(x=>x.id===id);if(!p)return;D=JSON.parse(JSON.stringify(p));const g=guestById(p.guest);D.gname=g?g.name:(p.name==='Walk-in'?'':p.name||'');D.gphone=g?.phone||'';D.gemail=g?.email||'';D.durTouched=true;renderPD()}
function openDrawer(title,body,foot){$('#drawer').innerHTML=`<div class="dr-head"><h3>${title}</h3><button class="icon-btn" data-act="closeDrawer">${ic('x')}</button></div><div class="dr-body">${body}</div>${foot?`<div class="dr-foot">${foot}</div>`:''}`;$('#drawer').classList.add('open');$('#scrim').classList.add('show')}
function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.remove('show');D=null}
function renderPD(){
 const isNew=!D.id,k=D.kind;const scroll=$('.dr-body')?.scrollTop||0;
 const g=guestById(D.guest);const tab=isNew?'details':(U.pdTab||'details');
 const title=isNew?'New party':esc(D.guest&&g?g.name:(D.gname||'Walk-in'));
 const tabs=isNew?`<div class="tabs">${[['walkin','Walk-in'],['booking','Booking'],['queue','Queue']].map(([kk,l])=>`<button class="${k===kk?'on':''}" data-act="pdKind" data-k="${kk}">${l}</button>`).join('')}</div>`:`<div class="tabs">${[['details','Details'],['chat','Chat'],['history','History']].map(([kk,l])=>`<button class="${tab===kk?'on':''}" data-act="pdTab" data-k="${kk}">${l}</button>`).join('')}</div>`;
 if(tab==='history'){const p=S.parties.find(x=>x.id===D.id);const h=(p.history||[]).slice().reverse();
  openDrawer(title,tabs+`<div style="padding-top:10px">${h.map(x=>`<div class="notif"><div class="ic">${ic('clock',15)}</div><div><div>${esc(x.text)}</div><div class="small mut">${new Date(x.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${x.by?' · '+esc(x.by):''}</div></div></div>`).join('')||'<div class="empty">No history yet.</div>'}</div>`);return}
 if(tab==='chat'){if(!D.guest){openDrawer(title,tabs+'<div class="empty">Add a guest with a phone number to chat with them.</div>');return}
  const c=S.chats.find(x=>x.guest===D.guest);if(c&&c.unread){c.unread=false;save();renderTop()}
  openDrawer(title,tabs+`<div class="thread">${c?c.messages.map(m=>`<div class="msg ${m.from}">${esc(m.text)}<time>${new Date(m.at).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'})}</time></div>`).join(''):'<div class="small mut">No messages yet. Say hello!</div>'}</div><label class="f">Message templates</label><div class="tagpick">${S.quickReplies.map((q,i)=>`<button data-act="qr" data-i="${i}">${esc(q.length>38?q.slice(0,38)+'…':q)}</button>`).join('')}</div>`,`<input class="inp" id="chatIn" placeholder="Type a message…" style="flex:3"><button class="btn pri" data-act="pdSendChat">${ic('send',15)}</button>`);
  const b=$('.dr-body');b.scrollTop=b.scrollHeight;$('#chatIn').onkeydown=e=>{if(e.key==='Enter')A.pdSendChat()};return}
 const unres=!isNew&&isUnresolved(S.parties.find(x=>x.id===D.id)||D);
 const tpick=S.areas.map(a=>{const ts=S.tables.filter(t=>t.area===a.id);return ts.length?`<div class="small mut" style="margin:8px 0 5px;font-weight:600">${esc(a.name)}${a.open===false?' · closed':''}</div><div class="tpick">${ts.map(t=>{const busy=!isFree(t.id,D.date,D.time,D.dur,D.id)||(k!=='booking'&&activeParty(t.id)&&activeParty(t.id).id!==D.id);const on=D.tables.includes(t.id);const closed=!tableUsable(t);return`<button class="${on?'on':''} ${(busy||closed)&&!on?'busy':''}" data-act="pdTable" data-id="${t.id}" title="${closed?'Closed':busy?'Booked at this time':''}">${esc(t.name)}<small>${t.min}-${t.max}</small></button>`}).join('')}</div>`:''}).join('');
 const sug=D.gname&&!D.guest?S.guests.filter(x=>x.name.toLowerCase().includes(D.gname.toLowerCase())||x.phone.includes(D.gname)).slice(0,5):[];
 const body=`${tabs}${!isNew?`<div class="row" style="margin-top:14px"><span class="chip ${ACTIVE.includes(D.status)?'blue':D.status==='finished'?'green':DEAD.includes(D.status)?'red':'amber'}">${unres?'Unresolved':STATUS_LABEL[D.status]}</span><span class="chip">${k==='walkin'?'Walk-in':k==='queue'?'Queue':k==='enquiry'?'Enquiry':'Booking'}</span>${D.created?`<span class="small mut">Created ${fmtDate(D.created)}</span>`:''}</div>`:''}
  ${unres?`<div class="card pad" style="margin-top:12px;background:var(--warnl);border-color:#f0d08a;padding:12px"><b>No action has been taken on this booking.</b><div class="small">You have until 23:59 ${fmtDate(resolveBy(D),{weekday:'short',day:'numeric',month:'short'})} to mark it as a no-show or complete it.</div><div class="row" style="margin-top:8px"><button class="btn sm" data-act="pdResolve" data-v="noshow">No-show</button><button class="btn sm pri" data-act="pdResolve" data-v="finished">Seat and complete</button></div></div>`:''}
  ${k==='booking'||k==='enquiry'?`<label class="f">Booking type</label><select class="inp" data-pd="type">${S.types.map(t=>`<option value="${t.id}" ${D.type===t.id?'selected':''}>${esc(t.name)}${t.price?` · £${t.price}pp`:''}</option>`).join('')}</select>`:''}
  <label class="f">Party size</label><div class="stepper"><button data-act="pdStep" data-f="size" data-n="-1">${ic('minus',16)}</button><input class="val inp" type="number" min="1" max="500" value="${D.size}" data-pd="size"><button data-act="pdStep" data-f="size" data-n="1">${ic('plus',16)}</button></div>
  ${k==='booking'||k==='enquiry'?`<div class="grid2"><div><label class="f">Date</label><input class="inp" type="date" value="${D.date}" data-pd="date"></div><div><label class="f">Time</label><input class="inp" type="time" step="900" value="${D.time}" data-pd="time"></div></div>${hoursFor(D.date).closed?`<div class="small" style="color:var(--bad);margin-top:6px">${ic('ban',12)} You're closed on this date.</div>`:''}`:''}
  ${k==='queue'?`<label class="f">Quoted wait</label><div class="stepper"><button data-act="pdStep" data-f="quote" data-n="-5">${ic('minus',16)}</button><div class="val">${D.quote} mins${S.settings.prefs.extraWait?` <span class="small mut">+${S.settings.prefs.extraWait} extra</span>`:''}</div><button data-act="pdStep" data-f="quote" data-n="5">${ic('plus',16)}</button></div>`:''}
  <label class="f">Seating duration</label><div class="stepper"><button data-act="pdStep" data-f="dur" data-n="-15">${ic('minus',16)}</button><div class="val">${fmtDur(D.dur)}</div><button data-act="pdStep" data-f="dur" data-n="15">${ic('plus',16)}</button></div>
  <label class="f">Table ${D.tables.length?`<span class="chip blue">${D.tables.map(tName).join(' + ')}</span>`:''} <a href="#" data-act="pdAuto" style="float:right">Auto-assign</a></label>
  <div class="small mut">You can pick more than one table if the party sits across several. Crossed-out tables are taken or closed.</div>${tpick}
  <label class="f">Guest</label>
  ${g?`<div class="selguest"><div class="av">${initials(g.name)}</div><div style="flex:1"><b>${esc(g.name)}</b><div class="small mut">${esc(g.phone)} · ${visits(g.id)} visits${noshows(g.id)?` · <span style="color:var(--bad)">${noshows(g.id)} no-shows</span>`:''}</div>${g.notes?`<div class="small" style="color:var(--bad)">${esc(g.notes)}</div>`:''}${g.tags.length?`<div class="row" style="gap:4px;margin-top:4px">${g.tags.map(id=>{const t=S.guestTags.find(x=>x.id===id);return t?`<span class="chip" style="background:${t.color||'#4a6cd0'}1f;color:${t.color||'#4a6cd0'}">${esc(t.name)}</span>`:''}).join('')}</div>`:''}</div><button class="icon-btn" data-act="pdClearGuest" title="Change guest">${ic('x',15)}</button></div>`:
  `<input class="inp" placeholder="${k==='walkin'?'Walk-in (optional name)':'Search or add a guest name'}" value="${esc(D.gname)}" data-pd="gname" autocomplete="off"><div id="gsug">${sugHtml(sug)}</div>
   <div class="grid2" style="margin-top:8px"><input class="inp" placeholder="Phone" value="${esc(D.gphone)}" data-pd="gphone"><input class="inp" placeholder="Email" value="${esc(D.gemail)}" data-pd="gemail"></div>`}
  ${k==='booking'?`<div class="grid2"><div><label class="f">Channel</label><select class="inp" data-pd="channel">${S.channels.filter(c=>c.id!=='walkin').map(c=>`<option value="${c.id}" ${D.channel===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div><label class="f">Booking status</label><select class="inp" data-pd="confirm">${[['confirmed','Confirmed'],['unconfirmed','SMS unconfirmed'],['none','Not required']].map(([v,l])=>`<option value="${v}" ${D.confirm===v?'selected':''}>${l}</option>`).join('')}</select></div></div>`:''}
  <label class="f">Comments</label><textarea class="inp" data-pd="notes" placeholder="Allergies, requests, occasion…">${esc(D.notes)}</textarea>
  <label class="f">Party tags</label>${PTAG_CATS.map(cat=>{const list=S.partyTags.filter(t=>t.cat===cat);return list.length?`<div class="small mut" style="margin:8px 0 5px">${cat}</div><div class="tagpick">${list.map(t=>`<button class="${D.tags.includes(t.id)?'on':''}" data-act="pdTag" data-id="${t.id}">${esc(t.name)}</button>`).join('')}</div>`:''}).join('')}
  ${!isNew&&k!=='enquiry'?`<label class="f">Status</label><select class="inp" data-pd="status">${Object.entries(STATUS_LABEL).filter(([kk])=>!['pending','declined'].includes(kk)).map(([kk,l])=>`<option value="${kk}" ${D.status===kk?'selected':''}>${l}</option>`).join('')}</select>
   <label class="row" style="margin-top:12px"><input type="checkbox" ${D.preorder?'checked':''} data-pd="preorder"> Pre-order received</label>
   ${D.preorder?S.menus.filter(m=>m.active||Object.keys(D.preItems||{}).some(id=>m.items.some(i=>i.id===id))).map(m=>`<div class="small mut" style="margin:10px 0 4px;font-weight:600">${esc(m.name)}</div>${m.items.map(it=>{const q=(D.preItems||{})[it.id]||0;return`<div class="row between" style="padding:4px 0;flex-wrap:nowrap"><span>${esc(it.name)} <span class="small mut">${money(it.price)}</span></span><div class="stepper" style="gap:6px"><button data-act="pdItem" data-id="${it.id}" data-n="-1" style="width:32px;height:32px">${ic('minus',14)}</button><b style="min-width:20px;text-align:center">${q}</b><button data-act="pdItem" data-id="${it.id}" data-n="1" style="width:32px;height:32px">${ic('plus',14)}</button></div></div>`}).join('')}`).join('')||'<div class="small mut">No pre-order menus yet.</div>':''}
   ${ACTIVE.includes(D.status)||D.status==='finished'?`<label class="f">Bill total (£)</label><input class="inp" type="number" min="0" step="0.01" value="${D.spend??''}" data-pd="spend" placeholder="Recorded for spend-per-head reports">`:''}`:''}`;
 const foot=isNew?`<button class="btn" data-act="closeDrawer">Cancel</button><button class="btn pri" data-act="pdSave">${k==='walkin'?'Seat walk-in':k==='queue'?'Add to queue':'Create booking'}</button>`:k==='enquiry'?`<button class="btn danger" data-act="enqDecline" data-id="${D.id}">Decline</button><button class="btn pri" data-act="enqAccept" data-id="${D.id}">Accept enquiry</button>`:`<button class="btn danger" style="flex:0 0 auto" data-act="pdDelete" title="Delete party">${ic('trash',15)}</button>${DEAD.includes(D.status)?'':`<button class="btn" data-act="pdCancel">Cancel booking</button>`}<button class="btn pri" data-act="pdSave">Save changes</button>`;
 openDrawer(title,body,foot);
 $('.dr-body').scrollTop=scroll;
}
function sugHtml(sug){return sug.length?`<div class="sug">${sug.map(x=>`<div data-act="pdPickGuest" data-id="${x.id}"><b>${esc(x.name)}</b> <span class="small mut">${esc(x.phone)} · ${visits(x.id)} visits</span></div>`).join('')}</div>`:''}

 <div class="grid2" style="grid-template-columns:1fr 1fr"><div><label class="f">Birthday</label><input class="inp" type="date" value="${g.birthday||''}" data-g="${id}:birthday"></div><div><label class="f">Anniversary</label><input class="inp" type="date" value="${g.anniversary||''}" data-g="${id}:anniversary"></div></div>
 <label class="f">Guest notes</label><textarea class="inp" data-g="${id}:notes" placeholder="Allergies, preferences…">${esc(g.notes)}</textarea>
 <label class="f">Tags</label><div class="tagpick">${S.guestTags.map(t=>`<button class="${g.tags.includes(t.id)?'on':''}" data-act="gTag" data-g="${id}" data-id="${t.id}">${esc(t.name)}</button>`).join('')}</div>

 `<button class="btn danger" data-act="delGuest" data-id="${id}">${ic('trash',15)} Delete</button><button class="btn pri" data-act="bookGuest" data-id="${id}">${ic('plus',15)} New booking</button>`)}

 const m=$('#modal');m.innerHTML=`<div class="modal card"><div class="pad row between" style="border-bottom:1px solid var(--line)"><h3>Help & FAQs</h3><button class="icon-btn" data-act="closeModal">${ic('x')}</button></div><div class="pad">${qa.map(([q,a])=>`<details style="padding:10px 0;border-bottom:1px solid var(--line)"><summary style="font-weight:600;cursor:pointer">${q}</summary><p class="mut" style="margin:8px 0 0">${a}</p></details>`).join('')}<button class="btn sm danger" style="margin-top:16px" data-act="resetDemo">Reset sample data</button></div></div>`;m.classList.add('show')};

function renderChats(){const c=U.chat&&S.chats.find(x=>x.id===U.chat);
 if(!c){openDrawer('Guest messages',S.chats.map(x=>{const g=guestById(x.guest);const last=x.messages[x.messages.length-1];return`<div class="sres" style="padding:12px 0" data-act="openChat" data-id="${x.id}"><div class="av">${initials(g?.name)}</div><div style="flex:1;min-width:0"><div class="row between"><b>${esc(g?.name||'Guest')}</b><span class="small mut">${relTime(last.at)}</span></div><div class="small mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last.from==='v'?'You: ':''}${esc(last.text)}</div></div>${x.unread?'<span class="dot" style="background:var(--pri)"></span>':''}</div>`}).join('')||'<div class="empty">No conversations.</div>');return}
 c.unread=false;save();renderTop();const g=guestById(c.guest);
 openDrawer(`<button class="icon-btn" data-act="chats" style="display:inline-grid;vertical-align:middle">${ic('left')}</button> ${esc(g?.name||'Guest')}`,`<div class="thread">${c.messages.map(m=>`<div class="msg ${m.from}">${esc(m.text)}<time>${new Date(m.at).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'})}</time></div>`).join('')}</div><label class="f">Quick replies</label><div class="tagpick">${S.quickReplies.map((q,i)=>`<button data-act="qr" data-i="${i}">${esc(q.length>38?q.slice(0,38)+'…':q)}</button>`).join('')}</div>`,
 `<input class="inp" id="chatIn" placeholder="Type a message…" style="flex:3"><button class="btn pri" data-act="sendChat">${ic('send',15)}</button>`);
 const b=$('.dr-body');b.scrollTop=b.scrollHeight;$('#chatIn').onkeydown=e=>{if(e.key==='Enter')A.sendChat()}}

function ask(msg,yes,label='Delete'){const m=$('#modal');m.innerHTML=`<div class="modal card" style="max-width:420px"><div class="pad"><b style="font-size:16px">Are you sure?</b><p class="mut">${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" id="askYes" style="background:var(--bad)">${label}</button></div></div></div>`;m.classList.add('show');$('#askYes').onclick=()=>{A.closeModal();yes()}}
function tablesFree(p,tables,date,time,dur){for(const t of tables){if(!isFree(t,date,time,dur,p.id))return tRaw(t)}return null}
A.go=el=>{U.view=el.dataset.v;U.setPage=null;U.setTab=null;U.floorSel=null;U.seating=null;U.areaMenu=null;if(U.view!=='floor')U.editFloor=false;render();$('#content').scrollTop=0};
A.setPage=el=>{U.setPage=el.dataset.v||null;U.setTab=null;render();$('#content').scrollTop=0};
A.goPage=el=>{U.view='settings';U.setPage=el.dataset.v;U.setTab=el.dataset.t||null;render();$('#content').scrollTop=0};
A.goChannels=()=>{U.view='guests';U.gTab='channels';U.setPage=null;render()};
A.advance=(el,e)=>{e.stopPropagation();const p=S.parties.find(x=>x.id===el.dataset.id);if(!p)return;
 if(isUnresolved(p)){p.status='finished';p.endedAt=null;logH(p,'Seated and completed (resolved)');save();toast(`${pName(p)} marked as completed`);render();return}
 if(p.date!==today()&&['booked','arrived','waiting'].includes(p.status)){toast(`This booking is for ${fmtDate(p.date)} — you can only seat today's parties`);return}
 if(['arrived','waiting'].includes(p.status)){
  if(!p.tables.length){const t=autoTable(today(),fromMin(nowMin()),p.dur,p.size,p.id);if(!t.length){toast('No free table — pick one');editParty(p.id);return}p.tables=t}
  const busy=p.tables.find(t=>activeParty(t)&&activeParty(t).id!==p.id);if(busy){toast(`${tRaw(busy)} is still occupied`);editParty(p.id);return}
  p.status='seated';p.seatedAt=nowMin();if(p.kind==='queue'){p.kind='walkin';p.fromQueue=true;p.time=fromMin(nowMin())}p.tables.forEach(t=>delete S.dirty[t]);logH(p,`Seated at ${p.tables.map(tRaw).join(' + ')}`);toast(`${pName(p)} seated at ${p.tables.map(tRaw).join(' + ')}`)}
 else if(p.status==='booked'){p.status='arrived';logH(p,'Marked as arrived');toast(`${pName(p)} has arrived`)}
 else if(p.status==='seated'){p.status='dessert';logH(p,'Moved to dessert')}
 else if(p.status==='dessert'){p.status='paying';logH(p,'Bill requested')}
 else if(p.status==='paying'){p.status='finished';p.endedAt=p.date===today()?nowMin():null;if(S.settings.prefs.autoDirty)p.tables.forEach(t=>S.dirty[t]=true);logH(p,'Finished');toast(`${pName(p)} finished${S.settings.prefs.autoDirty?' — table needs clearing':''}`)}
 save();render()};
A.noshow=(el,e)=>{e.stopPropagation();const p=S.parties.find(x=>x.id===el.dataset.id);p.status='noshow';logH(p,'Marked as no-show');save();toast(`${pName(p)} marked as no-show`);render()};
A.cancelParty=(el,e)=>{e&&e.stopPropagation();const p=S.parties.find(x=>x.id===el.dataset.id);p.status='cancelled';logH(p,'Cancelled');sendTemplate('cancelled',p);save();toast(`${pName(p)} cancelled`);render()};
A.delParty=(el,e)=>{e.stopPropagation();const p=S.parties.find(x=>x.id===el.dataset.id);p.status='deleted';logH(p,'Deleted');save();toast(`${pName(p)} deleted — find it under Deleted`);render()};
A.restore=(el,e)=>{e.stopPropagation();const p=S.parties.find(x=>x.id===el.dataset.id);p.status=p.kind==='queue'?'waiting':'booked';const clash=p.tables.length&&tablesFree(p,p.tables,p.date,p.time,p.dur);if(clash){p.tables=[];toast(`Restored without a table — ${clash} has been re-booked`)}else toast('Restored');logH(p,'Restored');save();render()};
A.showUnresolved=()=>{const u=S.parties.filter(isUnresolved).sort((a,b)=>a.date.localeCompare(b.date));if(!u.length)return;U.date=u[0].date;U.status='upcoming';U.cat='all';U.size='all';render()};
A.reopenQueue=()=>{S.settings.queue.closed=false;save();render();toast('Queue reopened')};
A.notifyQ=(el,e)=>{e.stopPropagation();const p=S.parties.find(x=>x.id===el.dataset.id);if(S.settings.prefs.confirmNotify&&U.pendingNotify!==p.id){U.pendingNotify=p.id;render();return}U.pendingNotify=null;p.notifiedAt=Date.now();logH(p,'Notified: table is ready');if(S.settings.queue.smsReady)sendSms(p,`Your table at ${S.venue.name} is ready! Please come to the front desk.`);const c=p.guest&&(S.chats.find(x=>x.guest===p.guest)||(S.chats.push({id:uid(),guest:p.guest,unread:false,messages:[]}),S.chats[S.chats.length-1]));if(c)c.messages.push({from:'v',text:`Your table at ${S.venue.name} is ready! Please come to the front desk.`,at:Date.now()});save();toast(`${pName(p)} notified that their table is ready`);render()};
A.tableStatus=el=>{const tid=el.dataset.id,v=el.value,p=activeParty(tid);
 if(p){if(v==='inuse')p.status='seated';else if(v==='dessert'||v==='paying')p.status=v;else{p.status='finished';p.endedAt=nowMin();if(v==='dirty')S.dirty[tid]=true;else delete S.dirty[tid]}logH(p,'Status changed to '+(STATUS_LABEL[p.status]))}
 else{if(v==='dirty')S.dirty[tid]=true;else if(v==='available')delete S.dirty[tid];else{render();newParty('walkin',{tables:[tid]});return}}
 save();render()};
A.addTable=()=>{let n=1;while(S.tables.some(t=>t.name==='N'+n))n++;const k=S.tables.filter(t=>t.area===U.area).length;const t={id:uid(),name:'N'+n,min:2,max:4,area:U.area,x:40+(k*30)%400,y:420-(k*10)%80,shape:'sq',open:true};S.tables.push(t);U.selTable=t.id;U.selDecor=null;save();render()};
A.delTable=()=>{const id=U.selTable;const n=S.parties.filter(p=>p.tables.includes(id)&&p.date>=today()&&!DEAD.includes(p.status)).length;ask(`Remove table ${tName(id)}?${n?` ${n} upcoming booking${n>1?'s':''} will lose this table and show as "No table".`:''}`,()=>{S.tables=S.tables.filter(t=>t.id!==id);S.parties.forEach(p=>{p.tables=p.tables.filter(t=>t!==id)});S.combos=S.combos.filter(c=>!c.tables.includes(id));delete S.dirty[id];U.selTable=null;save();render()},'Remove')};

A.logout=()=>{if(!CLOUD.ad){A.closeModal();toast('Sign-in is turned on once the cloud is connected');return}ask('Sign out of Proview Bookings on this device?',async()=>{try{if(CLOUD.on&&typeof cloudPush==='function')await cloudPush()}catch(e){}try{await CLOUD.ad.signOut()}catch(e){}try{localStorage.removeItem(KEY);localStorage.removeItem('proview-synced:'+KEY)}catch(e){}location.reload()},'Sign out')};
A.newGuest=()=>{openDrawer('Add guest',`<label class="f">Full name</label><input class="inp" id="ngName"><label class="f">Phone</label><input class="inp" id="ngPhone"><label class="f">Email</label><input class="inp" id="ngEmail" type="email"><label class="row" style="margin-top:12px"><input type="checkbox" id="ngMkt"> Opted in to marketing</label>`,`<button class="btn" data-act="closeDrawer">Cancel</button><button class="btn pri" data-act="saveNewGuest">Add guest</button>`);$('#ngName').focus()};

/* ================= learned seating times ================= */
let LEARN=null;
function learned(){if(LEARN)return LEARN;const from=addDays(today(),-60);const b={small:[],med:[],large:[]};
 S.parties.forEach(p=>{if(p.status!=='finished'||p.date<from||p.seatedAt==null||p.endedAt==null||p.kind==='queue')return;const d=p.endedAt-p.seatedAt;if(d<20||d>360)return;b[p.size<=2?'small':p.size<=4?'med':'large'].push(d)});
 LEARN={};for(const k in b){const a=b[k].sort((x,y)=>x-y);LEARN[k]={n:a.length,avg:a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length/5)*5:null,p80:a.length?Math.round(a[Math.floor(a.length*.8)]/5)*5:null}}return LEARN}
function learnedHtml(){const L=learned(),D=S.settings.durations;const lab={small:'1–2 guests',med:'3–4 guests',large:'5+ guests'};const ok=Object.values(L).some(x=>x.n>=8);
 return `<div class="card pad" style="max-width:760px;margin-top:14px"><b>Learned from your last 60 days</b><div class="small mut">How long parties actually stayed, from seated to finished.</div>
 <table class="t" style="margin-top:8px"><thead><tr><th>Party size</th><th>Your setting</th><th>Average stay</th><th>8 in 10 leave within</th><th>Parties</th></tr></thead><tbody>${['small','med','large'].map(k=>`<tr><td>${lab[k]}</td><td>${D[k]} mins</td><td><b>${L[k].avg??'—'}${L[k].avg?' mins':''}</b></td><td>${L[k].p80??'—'}${L[k].p80?' mins':''}</td><td>${L[k].n}</td></tr>`).join('')}</tbody></table>
 <div class="row" style="margin-top:12px">${ok?`<button class="btn sm pri" data-act="useLearned">Use the 8-in-10 times</button>`:'<span class="small mut">Needs at least 8 finished parties per size to suggest times.</span>'}<label class="row small">${tog('settings.prefs.autoDur',1)} Keep seating times updated automatically</label></div></div>`}
A.useLearned=()=>{const L=learned();['small','med','large'].forEach(k=>{if(L[k].n>=8)S.settings.durations[k]=Math.max(30,L[k].p80)});save();render();toast('Seating times updated from your history')};

 const byH={};seated.forEach(p=>{const h=Math.floor(toMin(p.time)/60);byH[h]=(byH[h]||0)+p.size});const peak=Object.entries(byH).sort((a,b)=>b[1]-a[1])[0];
 const tm=addDays(date,1);const tmr=S.parties.filter(p=>p.date===tm&&p.kind==='booking'&&!DEAD.includes(p.status));const tasks=S.tasks.filter(t=>t.date===date);
 return{date,parties:seated.length,covers:cov,walkins:seated.filter(p=>p.kind==='walkin').length,noshows:ps.filter(p=>p.status==='noshow').length,cancelled:ps.filter(p=>p.status==='cancelled').length,unresolved:ps.filter(isUnresolved).length,spend,perHead:spendCov?spend/spendCov:0,peak:peak?`${pad(peak[0])}:00 (${peak[1]} covers)`:'—',tmrParties:tmr.length,tmrCovers:tmr.reduce((a,p)=>a+p.size,0),tmrLarge:tmr.filter(p=>p.size>=6).length,staff:shiftsOn(date).length,tasksDone:tasks.filter(t=>t.status==='done').length,tasksAll:tasks.length,openTasks:tasks.filter(t=>t.status==='open').map(t=>t.title)}}

async function SupabaseAdapter(c){
 if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');
 const sb=window.supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(showNewPw,400)});
 const one=r=>{if(r.error)throw r.error;return r.data};
 return{kind:'supabase',sb,
  async user(){return(await sb.auth.getSession()).data.session?.user||null},

   const cur=(await sb.auth.getSession()).data.session?.user;if(cur&&String(cur.email||'').toLowerCase()!==j.email)await sb.auth.signOut();
   const v=await sb.auth.verifyOtp({token_hash:j.token_hash,type:'magiclink'});if(v.error)throw v.error;return v.data.user},
  async get(v){return one(await sb.from('bk_venue_state').select('data,updated_at').eq('id',v).maybeSingle())},
  async put(v,data,prev){const now=new Date().toISOString();const u=(await sb.auth.getUser()).data.user;
   if(prev==null){const r=await sb.from('bk_venue_state').insert({id:v,data,updated_at:now,updated_by:u?.id}).select('updated_at');if(r.error){if(r.error.code==='23505')return null;throw r.error}return r.data[0].updated_at}
   const r=await sb.from('bk_venue_state').update({data,updated_at:now,updated_by:u?.id}).eq('id',v).eq('updated_at',prev).select('updated_at');if(r.error)throw r.error;return r.data.length?r.data[0].updated_at:null},

// Same rules as Proview Signage: per-site licence, 7-day grace after a paid licence ends, trials stop when they end.
const LIC_TYPES=[['trial','3-day trial'],['m1','1 month'],['m3','3 months'],['m6','6 months'],['m12','12 months'],['m24','24 months'],['m36','36 months'],['lifetime','Lifetime'],['custom','Custom end date']];
const LIC_GRACE=7,DAYMS=864e5,LIC_MONTHS={m1:1,m3:3,m6:6,m12:12,m24:24,m36:36};
const PROVIEW_PHONE='020 8935 5495';
const licLabel=t=>(LIC_TYPES.find(x=>x[0]===t)||[0,'No licence'])[1];
const licDate=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function licState(s,now=Date.now()){
 const type=s?.license_type;if(!type)return{state:'none',type};
 if(type==='lifetime'||!s.license_expires_at)return{state:'lifetime',type};
 const exp=new Date(s.license_expires_at).getTime(),daysLeft=Math.ceil((exp-now)/DAYMS);
 if(now<exp)return{state:daysLeft<=14?'expiring':'active',type,daysLeft,expires:exp};
 const graceEnd=exp+(type==='trial'?0:LIC_GRACE)*DAYMS;
 if(now<graceEnd)return{state:'grace',type,daysLeft,graceLeft:Math.ceil((graceEnd-now)/DAYMS),expires:exp};
 return{state:'expired',type,daysLeft,expires:exp}}
function licSummary(s){const L=licState(s),trial=L.type==='trial';
 switch(L.state){case'none':return{text:'No licence',tone:'red',L};case'lifetime':return{text:'Lifetime licence',tone:'green',L};
  case'active':return{text:`${trial?'Trial':'Licensed'} · until ${licDate(L.expires)}`,tone:trial?'amber':'green',L};
  case'expiring':return{text:`${trial?'Trial':'Licence'} ends in ${plural(L.daysLeft,'day')}`,tone:'amber',L};
  case'grace':return{text:`Expired · ${plural(L.graceLeft,'day')} grace left`,tone:'red',L};
  default:return{text:trial?'Trial ended':'Licence expired',tone:'red',L}}}
const licChip=s=>{const{text,tone}=licSummary(s);return`<span class="chip ${tone}" title="${esc(licLabel(s.license_type))}">${esc(text)}</span>`};
const licWorks=s=>!['none','expired'].includes(licState(s).state);
function licPreview(type,{extend,current,custom}={}){
 if(type==='lifetime')return null;if(type==='custom')return custom?new Date(custom+'T23:59:59'):undefined;
 const now=new Date(),base=extend&&current&&new Date(current)>now?new Date(current):now,d=new Date(base);
 if(type==='trial')d.setDate(d.getDate()+3);else{const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+LIC_MONTHS[type]);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
 return d}
const isMaster=()=>!!(CLOUD.me&&CLOUD.me.is_master);
const bookUrl=id=>location.origin+location.pathname.replace(/[^/]*$/,'')+'book/?v='+encodeURIComponent(id);

/* --- after sign-in: pick the site this login can open --- */
async function afterSignIn(){
 let me=null;try{me=CLOUD.ad.whoami?await CLOUD.ad.whoami():null}catch(e){console.error('whoami',e)}
 if(!me){await cloudStart();return}                      // database without sites yet: old single-venue mode
 CLOUD.me=me;const sites=me.sites||[];
 if(!sites.length){if(me.is_master){showNoSites();return}showBusinessSetup();return}
 const want=LOC.cloud&&sites.some(s=>s.id===LOC.current)?LOC.current:sites[0].id;
 const wasKey=KEY;LOC={cloud:true,current:want,list:sites.map(s=>({id:s.id,name:s.name,business:s.business}))};
 try{localStorage.setItem(LOCKEY,JSON.stringify(LOC))}catch(e){}
 if(wasKey!=='proview-bookings-v3:'+want){location.reload();return}
 CLOUD.vid=want;CLOUD.site=sites.find(s=>s.id===want);
 if(!isMaster()&&!licWorks(CLOUD.site)){showLicenceLock();return}
 await cloudStart();
}

/* --- online sign-up: set up the business (3-day trial) --- */
function showBusinessSetup(msg){document.body.classList.add('gate');const a=$('#auth');
 a.innerHTML=`<div class="auth-form" style="grid-column:1/-1"><form novalidate onsubmit="return bizSetupSubmit(event)">
  <div class="auth-brand"><div class="logo"></div><span class="wordmark">PROVIEW<span>BOOKINGS</span></span></div>

  <label class="af">Business name<input id="bzName" placeholder="e.g. Bella Pizza" autocomplete="organization"></label>
  <label class="af">Venue name<input id="bzSite" placeholder="e.g. Bella Pizza High Street"></label>
  <label class="af">Phone (optional)<input id="bzPhone" type="tel" autocomplete="tel" placeholder="So we can help you get set up"></label>
  <button class="go" type="submit" id="authGo">Start my free trial</button>
  <div class="small mut" style="text-align:center">Signed in as ${esc(CLOUD.user?.email||'')} · <a href="#" data-act="authSignOut">Sign out</a></div>
 </form></div>`;a.hidden=false;setTimeout(()=>$('#bzName')?.focus(),50)}
async function bizSetupSubmit(ev){ev&&ev.preventDefault();const n=$('#bzName').value.trim(),s=$('#bzSite').value.trim()||n,go=$('#authGo');
 if(n.length<2){authNote('Enter your business name.');$('#bzName').focus();return false}
 go.disabled=true;go.textContent='Setting up…';
 try{const sid=await CLOUD.ad.rpc('bk_create_my_business',{p_business:n,p_site:s,p_phone:$('#bzPhone').value.trim()});
  LOC={cloud:true,current:sid,list:[{id:sid,name:s,business:n}]};localStorage.setItem(LOCKEY,JSON.stringify(LOC));sessionStorage.setItem('pv-newsite',s);location.reload()}
 catch(e){go.disabled=false;go.textContent='Start my free trial';authNote(authErr(e))}
 return false}
A.authSignOut=async(el,ev)=>{ev&&ev.preventDefault();try{await CLOUD.ad.signOut()}catch(e){}try{localStorage.removeItem(LOCKEY)}catch(e){}location.reload()};

function showNoSites(){document.body.classList.add('gate');const a=$('#auth');a.innerHTML=`<div class="auth-form" style="grid-column:1/-1"><div class="lockcard"><div class="auth-brand"><div class="logo"></div><span class="wordmark">PROVIEW<span>BOOKINGS</span></span></div><h1>No venues yet</h1><p class="muted">Add businesses, venues and licences in the Proview licence portal, then come back here.</p><a class="go" style="display:grid;place-items:center;text-decoration:none" href="https://license.proviewcrm.co.uk" target="_blank" rel="noopener">Open licence portal ↗</a><div class="alinks"><button type="button" data-act="lockRetry">Check again</button><button type="button" data-act="authSignOut">Sign out</button></div></div></div>`;a.hidden=false}
/* --- licence ended: lock the app (staff) --- */
function showLicenceLock(){document.body.classList.add('gate');const s=CLOUD.site,L=licState(s),a=$('#auth');const others=(LOC.list||[]).filter(x=>x.id!==s.id);
 a.innerHTML=`<div class="auth-form" style="grid-column:1/-1"><div class="lockcard">
  <div class="auth-brand"><div class="logo"></div><span class="wordmark">PROVIEW<span>BOOKINGS</span></span></div>
  <h1>${L.type==='trial'?'Your free trial has ended':L.state==='none'?'No licence for this venue':'Your licence has expired'}</h1>
  <p class="muted"><b>${esc(s.name)}</b>${L.expires?` · ended ${licDate(L.expires)}`:''}. Bookings are kept safe, but this venue can't be used and online booking is paused until it's renewed.</p>
  ${canBuy()?`<button class="go" type="button" data-act="buyOnline">${L.type==='trial'||L.state==='none'?'Buy a licence online':'Renew online'}</button><div class="notice">Or call Proview on <b>${PROVIEW_PHONE}</b>.</div>`:`<div class="notice">${CLOUD.me?'Ask your manager to renew it, or call':'Call'} Proview on <b>${PROVIEW_PHONE}</b> to ${L.type==='trial'?'buy a licence':'renew'}.</div>`}
  ${others.length?`<label class="af">Open another venue<select class="inp" style="height:44px" onchange="A.openSite({dataset:{id:this.value}})"><option value="">Choose…</option>${others.map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select></label>`:''}
  <div class="alinks"><button type="button" data-act="lockRetry">I've renewed — check again</button><button type="button" data-act="authSignOut">Sign out</button></div>
 </div></div>`;a.hidden=false}
A.lockRetry=()=>location.reload();

/* --- buy or renew this venue's licence online (prices and Stripe links come from the Proview licence portal) --- */
const canBuy=()=>!!(CLOUD.site&&CLOUD.me&&!isMaster()&&((CLOUD.me.sites||[]).find(x=>x.id===CLOUD.site.id)?.role==='Admin'));
const BUY_ORDER=['m1','m3','m6','m12','m24','m36','lifetime'];
const buyMoney=p=>new Intl.NumberFormat('en-GB',{style:'currency',currency:(p.currency||'gbp').toUpperCase()}).format(p.amount/100);
A.buyOnline=async()=>{let plans={};try{plans=await CLOUD.ad.rpc('licence_buy_plans')||{}}catch(e){}
 const s=CLOUD.site,list=Object.entries(plans).sort((a,b)=>BUY_ORDER.indexOf(a[0])-BUY_ORDER.indexOf(b[0]));
 if(!list.length){toast(`Online payment isn’t available yet. Call Proview on ${PROVIEW_PHONE}.`);return}
 const pick=(list.find(([k])=>k==='m12')||list[0])[0],buying=!s.license_type||s.license_type==='trial';
 const m=$('#modal');m.innerHTML=`<div class="modal card" style="max-width:440px;margin-top:8vh"><div class="pad"><div class="row between"><b style="font-size:17px">${buying?'Buy a licence':'Renew licence'}: ${esc(s.name)}</b><button class="icon-btn" data-act="closeModal">${ic('x')}</button></div>
  <p class="small mut" style="margin:6px 0 12px">${buying?'Choose a plan. You’ll pay securely with Stripe, and the venue is licensed within about 5 minutes.':'Choose a plan. Time is added on top of your current licence. You’ll pay securely with Stripe; it updates within about 5 minutes.'}</p>
  ${list.map(([k,p])=>`<label class="row card pad" style="font-weight:600;padding:12px 14px;margin-bottom:8px;cursor:pointer"><input type="radio" name="buyPlan" value="${esc(k)}" ${k===pick?'checked':''}><span style="flex:1">${esc(p.label||k)}</span>${esc(buyMoney(p))}</label>`).join('')}
  <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="buyGo">Pay with card</button></div></div></div>`;m.classList.add('show');
 A.buyGo=()=>{const k=m.querySelector('input[name=buyPlan]:checked')?.value,p=plans[k];if(!p)return;const u=new URL(p.link);
  u.searchParams.set('client_reference_id',`${p.ref||'pvb'}__${s.id}__${k}`);const em=CLOUD.user?.email||CLOUD.me?.email;if(em)u.searchParams.set('prefilled_email',em);
  window.open(u.toString(),'_blank','noopener');A.closeModal();toast('Finish paying in the Stripe tab. Your licence updates within about 5 minutes.')}};
/* --- banner inside the app when the licence needs attention --- */
function licBannerHtml(){if(!CLOUD.site)return'';const s=CLOUD.site,L=licState(s),who=isMaster()?'Renew it at license.proviewcrm.co.uk.':`Call Proview on ${PROVIEW_PHONE} to renew.`;
 let t='';if(L.state==='grace')t=`This venue's licence expired on ${licDate(L.expires)}. It keeps working for ${plural(L.graceLeft,'more day')}, then it stops. ${who}`;
 else if(L.state==='expiring')t=`${L.type==='trial'?'Your free trial':'This venue\'s licence'} ends on ${licDate(L.expires)} (${plural(L.daysLeft,'day')}). ${L.type==='trial'?`Call Proview on ${PROVIEW_PHONE} to keep using Proview Bookings.`:who}`;
 else if(isMaster()&&['expired','none'].includes(L.state))t=`${esc(s.name)} has ${L.state==='none'?'no licence':'an expired licence'}. Staff are locked out and online booking is paused. You can still open it as the Proview admin.`;
 if(!t)return'';const bad=['grace','expired','none'].includes(L.state);
 return`<div class="card pad row noprint licbar" style="margin-bottom:14px;${bad?'background:var(--badl);border-color:#f2b8be':'background:var(--warnl);border-color:#f0d08a'}">${ic('clock',16)}<span style="flex:1">${t}</span>${isMaster()?`<button class="btn sm" data-act="admLicence">Licence portal ↗</button>`:canBuy()?`<button class="btn sm pri" data-act="buyOnline">${L.type==='trial'||L.state==='none'?'Buy licence online':'Renew online'}</button>`:''}</div>`}

/* --- master admin (Proview): businesses, sites and licences are managed at license.proviewcrm.co.uk; in the app the master switches sites with the picker --- */
/* site picker (same as Proview Signage's client picker): master sees every site, grouped by business */
function sitePickHtml(compact){const L=LOC.cloud?(LOC.list||[]):[];if(!L.length)return'';
 if(L.length===1&&!isMaster())return compact?'':`<div class="sp-title" title="${esc(L[0].name)}">${esc(L[0].name)}</div>`;
 const sorted=L.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name)));
 const all=U.view==='allsites'&&isMaster(),opt=l=>`<option value="${esc(l.id)}" ${l.id===LOC.current&&!all?'selected':''}>${esc(l.name)}</option>`;
 return`${compact?'':`<label class="pv-viewing">${all?'Master view':'Viewing site'}</label>`}<select aria-label="Site" title="Switch site" data-act-change="pickSite">${isMaster()?`<option value="__all" ${all?'selected':''}>All sites (${L.length})</option>`:''}${sorted.map(opt).join('')}</select>`}
A.pickSite=el=>{if(el.value==='__all'){U.view='allsites';render();return}if(el.value&&el.value===LOC.current&&U.view==='allsites'){U.view='parties';render();return}if(el.value&&el.value!==LOC.current){U.view='parties';A.openSite({dataset:{id:el.value}})}};
/* "All sites" (master admins, from the site picker): every site's licence and today's bookings at a glance */
TITLES.allsites='All sites';
const ALLS={rows:null,busy:false,at:0,err:''};
VIEWS.allsites=()=>{if(!isMaster())return VIEWS.parties();
 const sites=CLOUD.me?.sites||[],R=ALLS.rows,by=id=>R&&R[id];
 const sum=k=>R?sites.reduce((n,x)=>n+((by(x.id)||{})[k]||0),0):'…';
 const stat=(k,v)=>`<div class="card stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
 const row=x=>{const r=by(x.id);return`<tr><td><b>${esc(x.name)}</b>${x.business?`<div class="small mut">${esc(x.business)}</div>`:''}</td><td>${licChip(x)}</td><td>${r?r.b:'…'}</td><td>${r?r.c:'…'}</td><td>${r?r.s:'…'}</td><td class="small mut">${r&&r.at?esc(new Date(r.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})):'—'}</td><td style="text-align:right"><button class="btn sm ${x.id===LOC.current?'':'pri'}" data-act="allOpen" data-id="${esc(x.id)}">${x.id===LOC.current?'Back to this site':'Open'}</button></td></tr>`};
 return`<div class="stats">${stat('Sites',sites.length)}${stat('Licensed',sites.filter(licWorks).length)}${stat('Bookings today',sum('b'))}${stat('Covers today',sum('c'))}</div>
 ${ALLS.err?`<div class="notice bad" style="margin-bottom:12px">${esc(ALLS.err)}</div>`:''}
 <div class="card"><div class="pad row between"><div><b style="font-size:16px">Every site</b><div class="small mut">Today's bookings across all businesses. Open a site to see it as its team does.</div></div><a class="btn sm" href="${LIC_PORTAL}" target="_blank" rel="noopener">Licences ↗</a></div>
 ${sites.length?`<table class="t"><thead><tr><th>Site</th><th>Licence</th><th>Bookings today</th><th>Covers</th><th>Seated now</th><th>Last change</th><th></th></tr></thead><tbody>${sites.map(row).join('')}</tbody></table>`:`<div class="pad mut">No sites yet. Add businesses and sites in the licence portal.</div>`}</div>`};
AFTER.allsites=async()=>{if(!isMaster()||ALLS.busy||!CLOUD.ad?.sb)return;if(ALLS.at&&Date.now()-ALLS.at<60e3)return;ALLS.busy=true;
 try{const r=await CLOUD.ad.sb.from('bk_venue_state').select('id,updated_at,parties:data->parties');if(r.error)throw r.error;
  const t=today(),rows={};(r.data||[]).forEach(v=>{const ps=(Array.isArray(v.parties)?v.parties:[]).filter(p=>p&&p.date===t&&p.kind!=='enquiry'&&!['cancelled','deleted','noshow'].includes(p.status));
   rows[v.id]={b:ps.length,c:ps.reduce((n,p)=>n+(+p.size||0),0),s:ps.filter(p=>ACTIVE.includes(p.status)).length,at:v.updated_at}});
  (CLOUD.me?.sites||[]).forEach(x=>{if(!rows[x.id])rows[x.id]={b:0,c:0,s:0,at:null}});ALLS.rows=rows;ALLS.at=Date.now();ALLS.err=''}
 catch(e){ALLS.err='Couldn’t load today’s bookings: '+(e.message||e);ALLS.at=Date.now()}
 ALLS.busy=false;if(U.view==='allsites')render()};
A.allOpen=el=>{const id=el.dataset.id;U.view='parties';if(id===LOC.current){render();return}A.openSite({dataset:{id}})};
A.openSite=el=>{const id=el.dataset.id;if(!id)return;if(id===CLOUD.vid)return;save();LOC.current=id;if(!LOC.list.some(x=>x.id===id)){LOC.list.push({id,name:id})}LOC.cloud=true;localStorage.setItem(LOCKEY,JSON.stringify(LOC));location.reload()};

{const _rt=renderTop,_rn=renderNav;renderTop=function(){const r=_rt.apply(this,arguments);try{const t=document.getElementById('top');if(t&&!t.querySelector('.hdr-cap')){const ks=['goPage','search','chats','enquiries','notifs'].map(k=>t.querySelector(':scope>[data-act='+k+']')).filter(Boolean);if(ks.length){const cap=document.createElement('div');cap.className='hdr-cap';ks[0].before(cap);ks.forEach(e=>cap.appendChild(e))}}}catch(e){}topMe('logout');return r};renderNav=function(){const r=_rn.apply(this,arguments);topMe('logout');return r}}
